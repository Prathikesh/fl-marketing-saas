seed: 42

data:
  raw_file: Lead Scoring.csv
  tenant_key: Lead Source
  min_tenant_rows: 150
  launch_span_days: 90
  val_size: 0.1
  test_size: 0.2

privacy:
  epsilon: 1.0
  noise_multiplier: 1.1
  max_grad_norm: 1.0
  delta: 1.0e-5

federated:
  num_tenants: 5
  rounds: 15
  local_epochs: 3
  local_lr: 0.001
  mu: 0.0
  min_clients: 3

adaptation:
  buffer_threshold: 50
  delay_min_days: 7
  delay_max_days: 30
  adapt_lr: 0.0005
  adapt_epochs: 3
