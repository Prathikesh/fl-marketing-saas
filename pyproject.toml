[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fl-marketing"
version = "0.1.0"
description = "Privacy-Preserving Continuous Learning Framework for Multi-Tenant Marketing AI"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "opacus",
    "flwr",
    "numpy",
    "pandas",
    "scikit-learn",
    "pydantic",
    "pyyaml",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
